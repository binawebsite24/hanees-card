<style>
  /* ---------- Design tokens ----------
     Deep field. Near-black space, violet + mint nebula, one mint accent
     spent only on the things you tap. Edit colours here. */
  :root{
    --ink:         #04060D;
    --space:       #080C1A;
    --card:        rgba(9,13,26,0.58);
    --accent:      #78E3C8;
    --accent-deep: #3BBF9E;
    --accent-rgb:  120,227,200;
    --cream:       #EDF1F7;
    --dim:         rgba(237,241,247,0.64);
    --line:        rgba(var(--accent-rgb),0.18);
    --line-soft:   rgba(var(--accent-rgb),0.10);
    --hair:        rgba(255,255,255,0.08);
    --glass:       rgba(255,255,255,0.035);
    --cta-ink:     #03110C;
    --scrim:       rgba(4,6,13,0.78);
    --sheet-bg:    #F3F6FA;
    --sheet-ink:   #10172A;
    --sheet-dim:   #5B667A;
    --qr-bg:       #FFFFFF;
    --qr-fg:       #0A1020;
    --r:           16px;
    --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  html{
    background:var(--ink);
    /* Tell the browser this page is dark, so the area it paints past the end
       of the document (overscroll, scrollbars) is dark too, not white. */
    color-scheme:dark;
  }
  /* Stop the rubber-band scroll that exposes that area in the first place. */
  html,body{ overscroll-behavior-y:none; }
  body{
    min-height:100svh;
    font-family:var(--display);
    color:var(--cream);
    background:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex; justify-content:center; align-items:center;
    padding:max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  }
  a{ color:var(--accent); }
  a:hover{ color:var(--cream); }

  /* ---------- Sky (canvas) ---------- */
  #sky{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }
  .vignette{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(120% 95% at 50% 38%, rgba(4,6,13,0) 40%, rgba(4,6,13,0.78) 100%);
  }

  /* ---------- Card ---------- */
  .card{
    position:relative; z-index:1;
    width:100%; max-width:430px;
    padding:36px 26px 26px;
    border-radius:28px;
    background:var(--card);
    border:1px solid var(--hair);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 60px 120px -50px rgba(0,0,0,0.9),
      0 0 90px -40px rgba(var(--accent-rgb),0.35);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);
    backdrop-filter:blur(22px) saturate(1.3);
  }

  /* ---------- Avatar ---------- */
  .avatar{ position:relative; width:104px; height:104px; margin:0 auto 18px; border-radius:50%; }
  .avatar[hidden]{ display:none; }
  .avatar::after{
    content:""; position:absolute; inset:-34px; border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(closest-side, rgba(var(--accent-rgb),0.22), transparent 72%);
  }
  .avatar .halo{ position:absolute; inset:-8px; border-radius:50%; border:1px solid rgba(var(--accent-rgb),0.22); }
  .avatar .orbit{
    position:absolute; inset:-8px; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg 230deg, rgba(var(--accent-rgb),0.15) 275deg, rgba(var(--accent-rgb),1) 330deg, transparent 332deg 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
  }
  .avatar .ph{
    position:absolute; inset:0; border-radius:50%; overflow:hidden; background:var(--space);
    transform:translateZ(0);
    box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset, 0 24px 50px -20px rgba(var(--accent-rgb),0.45);
  }
  .avatar .ph img, .avatar .ph video{
    width:100%; height:100%; object-fit:cover; object-position:50% 28%; display:block;
    transform:scale(1.7); transform-origin:40% 6%;
    filter:contrast(1.06) saturate(1.05);
  }
  .monogram{
    position:relative; width:104px; height:104px; margin:0 auto 18px; border-radius:50%;
    display:grid; place-items:center;
    border:1px solid var(--line);
    background:radial-gradient(120% 120% at 30% 20%, rgba(var(--accent-rgb),0.16), rgba(var(--accent-rgb),0.02));
    font-weight:600; font-size:30px; letter-spacing:0.02em; color:var(--accent);
  }
  .monogram[hidden]{ display:none; }

  /* ---------- Header text ---------- */
  h1{
    position:relative; font-weight:700; font-size:34px; line-height:1.05;
    letter-spacing:-0.025em; text-align:center; margin:0 0 8px;
  }
  .role{
    position:relative; text-align:center; font-size:14.5px; line-height:1.5;
    color:var(--dim); margin:0 auto 12px; max-width:30ch; text-wrap:pretty;
  }
  .role b{ color:var(--cream); font-weight:600; }
  .status{
    position:relative; display:flex; justify-content:center; align-items:center; gap:8px;
    margin:0 0 26px; font-family:var(--mono); font-size:11.5px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--accent);
  }
  .status .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
  .status .caret{ display:inline-block; width:6px; height:11px; background:var(--accent); margin-left:-4px; opacity:0.9; }

  .cred{ position:relative; display:flex; justify-content:center; margin:-12px auto 22px; }
  .cred[hidden]{ display:none; }
  .cred span{
    display:inline-flex; align-items:center; gap:9px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--accent); padding:7px 15px; border:1px solid var(--line); border-radius:999px;
    background:rgba(var(--accent-rgb),0.05);
  }

  /* ---------- Primary action ---------- */
  .save{
    position:relative; width:100%; border:0; cursor:pointer;
    font-family:var(--display); font-size:15px; font-weight:600; letter-spacing:0.01em;
    color:var(--cta-ink);
    background:linear-gradient(180deg, var(--accent), var(--accent-deep));
    padding:16px 18px; border-radius:var(--r);
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 14px 34px -14px rgba(var(--accent-rgb),0.6);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .save:hover{ filter:brightness(1.03); }
  .save:active{ transform:translateY(1px) scale(0.995); }
  .save svg{ width:18px; height:18px; flex:none; }
  .save span{ white-space:nowrap; }

  /* ---------- Book a call ---------- */
  .book{
    position:relative; display:flex; align-items:center; gap:14px;
    margin-top:8px; padding:12px 14px 12px 12px; border-radius:var(--r);
    border:1px solid rgba(var(--accent-rgb),0.34); background:rgba(var(--accent-rgb),0.07);
    color:var(--cream); text-decoration:none;
    transition:transform .25s cubic-bezier(.2,.7,.2,1), background .2s ease, border-color .2s ease, box-shadow .25s ease;
  }
  .book[hidden]{ display:none; }
  .book:hover{ color:var(--cream); }
  .book:active{ transform:translateY(1px); }
  .book .bk-ic{
    width:42px; height:42px; flex:none; border-radius:12px; display:grid; place-items:center;
    background:rgba(var(--accent-rgb),0.14); color:var(--accent);
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .book .bk-ic svg{ width:21px; height:21px; }
  .book .bk-tx{ display:flex; flex-direction:column; line-height:1.3; min-width:0; }
  .book .bk-tx b{ font-size:14.5px; font-weight:600; }
  .book .bk-tx small{ font-size:12px; color:var(--dim); }
  .book .bk-go{ margin-left:auto; color:var(--accent); display:grid; place-items:center; transition:transform .3s cubic-bezier(.2,.7,.2,1); }
  .book .bk-go svg{ width:18px; height:18px; }

  /* ---------- Share / QR row ---------- */
  .actions{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .actions[hidden]{ display:none; }
  .actions button{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 10px; border-radius:13px; border:1px solid var(--line); background:var(--glass);
    color:var(--cream); font-family:var(--display); font-size:13px; font-weight:600; letter-spacing:0.01em;
    cursor:pointer; transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .actions button:active{ transform:translateY(1px); }
  .actions button:hover{ background:rgba(var(--accent-rgb),0.07); }
  .actions svg{ width:17px; height:17px; color:var(--accent); }

  /* ---------- QR overlay ---------- */
  #qrModal{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    padding:24px; background:var(--scrim);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{
    background:var(--sheet-bg); border-radius:22px; padding:22px 22px 18px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);
  }
  #qrModal .sheet h3{ margin:0 0 4px; font-weight:600; font-size:20px; letter-spacing:-0.01em; color:var(--sheet-ink); }
  #qrModal .sheet p{ margin:0 0 14px; font-family:var(--mono); font-size:11px; color:var(--sheet-dim); word-break:break-all; }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; border-radius:10px; }
  #qrModal .close{
    margin-top:14px; width:100%; border:0; border-radius:12px; cursor:pointer; padding:11px;
    font-family:var(--display); font-size:13px; font-weight:600; color:var(--cream); background:var(--space);
  }

  /* ---------- Quick row ---------- */
  .quick{ position:relative; display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:8px; }
  .quick a{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:13px 6px; border-radius:13px; border:1px solid var(--line); background:var(--glass);
    color:var(--cream); text-decoration:none; font-size:11.5px; letter-spacing:0.02em;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .quick a:active{ transform:translateY(1px); }
  .quick a:hover{ background:rgba(var(--accent-rgb),0.07); color:var(--cream); }
  .quick svg{ width:19px; height:19px; color:var(--accent); }

  /* ---------- Divider ---------- */
  .sep{
    position:relative; display:flex; align-items:center; gap:12px; margin:24px 2px 14px;
    color:var(--accent); font-family:var(--mono); font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.75;
  }
  .sep::before, .sep::after{ content:""; height:1px; flex:1; background:var(--line-soft); }

  /* ---------- Socials ---------- */
  .socials{ position:relative; display:flex; flex-direction:column; gap:8px; }
  .social{
    display:flex; align-items:center; gap:14px; padding:13px 15px; border-radius:13px;
    border:1px solid var(--line-soft); background:var(--glass); color:var(--cream); text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .social:active{ transform:translateY(1px); }
  .social:hover{ background:rgba(var(--accent-rgb),0.06); border-color:var(--line); color:var(--cream); }
  .social .ic{ width:22px; height:22px; flex:none; color:var(--accent); display:grid; place-items:center; }
  .social .ic svg{ width:20px; height:20px; }
  .social .tx{ display:flex; flex-direction:column; line-height:1.25; }
  .social .tx .name{ font-size:14px; font-weight:600; }
  .social .tx .sub{ font-size:12px; color:var(--dim); }
  .social .go{ margin-left:auto; color:var(--accent); opacity:0.55; }
  .social .go svg{ width:16px; height:16px; }

  /* ---------- Footer ---------- */
  footer{ position:relative; margin-top:24px; text-align:center; font-size:11.5px; letter-spacing:0.02em; color:var(--dim); }
  footer a{ color:var(--accent); text-decoration:none; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:var(--space); color:var(--cream); border:1px solid var(--line);
    padding:12px 16px; border-radius:12px; font-size:13px; max-width:88vw;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
    opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease; z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Motion ---------- */
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @keyframes orbit{ to{ transform:rotate(360deg); } }
  @keyframes blink{ 0%,49%{ opacity:0.9; } 50%,100%{ opacity:0; } }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),0.55); } 70%{ box-shadow:0 0 0 7px rgba(var(--accent-rgb),0); } }
  @media (prefers-reduced-motion:no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .avatar .orbit{ animation:orbit 7s linear infinite; }
    .status .caret{ animation:blink 1.1s steps(1) infinite; }
    .status .dot{ animation:pulse 2.6s ease-out infinite; }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }

  /* ---------- Hover motion (pointer devices only) ---------- */
  .save svg, .actions svg, .quick svg, .social .ic, .social .go{ transition:transform .3s cubic-bezier(.2,.7,.2,1), opacity .3s ease; }
  .avatar .ph img{ transition:transform 1.2s cubic-bezier(.2,.7,.2,1); }
  @media (hover:hover) and (prefers-reduced-motion:no-preference){
    .save{ overflow:hidden; }
    .save::after{
      content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
      background:linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
      transform:skewX(-20deg); transition:left .7s ease; pointer-events:none;
    }
    .save:hover::after{ left:125%; }
    .save:hover{ transform:translateY(-2px); box-shadow:0 22px 40px -16px rgba(var(--accent-rgb),0.75); }
    .save:hover svg{ transform:translateY(-1px) scale(1.1); }
    .actions button:hover, .quick a:hover{
      transform:translateY(-3px); border-color:rgba(var(--accent-rgb),0.42);
      box-shadow:0 14px 26px -18px rgba(var(--accent-rgb),0.6);
    }
    .actions button:hover svg, .quick a:hover svg{ transform:scale(1.14); }
    .social:hover{ transform:translateX(4px); border-color:rgba(var(--accent-rgb),0.36); }
    .social:hover .ic{ transform:scale(1.12); }
    .social:hover .go{ opacity:1; transform:translate(3px,-3px); }
    .book:hover{
      transform:translateY(-2px); background:rgba(var(--accent-rgb),0.12);
      border-color:rgba(var(--accent-rgb),0.6); box-shadow:0 16px 30px -18px rgba(var(--accent-rgb),0.65);
    }
    .book:hover .bk-ic{ transform:rotate(-6deg) scale(1.06); }
    .book:hover .bk-go{ transform:translateX(4px); }
    .avatar:hover .ph img{ transform:scale(1.78); }
    footer a:hover{ text-decoration:underline; text-underline-offset:3px; }
  }

  /* ---------- Mobile: full-bleed, sky shows through the top ---------- */
  @media (max-width:480px){
    body{ padding:0; display:block; }
    .card{
      max-width:none; min-height:100svh; border-radius:0; border:0; box-shadow:none;
      -webkit-backdrop-filter:none; backdrop-filter:none;
      background:linear-gradient(180deg, rgba(4,6,13,0) 0%, rgba(4,6,13,0.30) 24%, rgba(4,6,13,0.74) 58%, rgba(4,6,13,0.9) 100%);
      padding:max(52px, calc(env(safe-area-inset-top) + 30px)) 20px max(28px, env(safe-area-inset-bottom));
    }
    .avatar, .monogram{ width:116px; height:116px; margin-bottom:20px; }
    .monogram{ font-size:34px; }
    h1{ font-size:clamp(34px, 9.5vw, 42px); }
    .role{ font-size:15.5px; max-width:32ch; }
    .status{ font-size:12px; margin-bottom:28px; }
    .cred span{ font-size:11px; padding:8px 16px; }
    .save{ min-height:58px; font-size:16.5px; border-radius:18px; }
    .save svg{ width:20px; height:20px; }
    .book{ border-radius:18px; margin-top:10px; }
    .actions{ gap:10px; margin-top:10px; }
    .actions button{ min-height:50px; font-size:14.5px; border-radius:14px; }
    .quick{ gap:10px; margin-top:10px; }
    .quick a{ min-height:68px; justify-content:center; font-size:12.5px; border-radius:14px; }
    .quick svg{ width:22px; height:22px; }
    .sep{ font-size:11px; margin:28px 2px 16px; }
    .socials{ gap:10px; }
    .social{ min-height:60px; padding:14px 16px; border-radius:14px; }
    .social .ic svg{ width:22px; height:22px; }
    .social .tx .name{ font-size:15.5px; }
    .social .tx .sub{ font-size:13px; }
    footer{ font-size:12.5px; margin-top:28px; }
    #toast{ font-size:14px; bottom:max(24px, env(safe-area-inset-bottom)); }
  }

  /* ---------- Desktop ---------- */
  @media (min-width:900px){
    body{ padding:48px 32px; }
    .card{ max-width:460px; padding:44px 36px 32px; }
    h1{ font-size:38px; }
  }
</style>
<style>
  /* ===== Orbit theme overrides ===== */
  :root{
    --ink:#000; --space:#05070B; --card:rgba(2,3,7,0.55);
    --accent:#FFFFFF; --accent-deep:#DCE4EE; --accent-rgb:190,212,255;
    --cream:#F2F5F9; --dim:rgba(242,245,249,0.62);
    --line:rgba(255,255,255,0.16); --line-soft:rgba(255,255,255,0.09);
    --glass:rgba(255,255,255,0.025); --cta-ink:#000; --r:3px;
    --display:"Archivo", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .vignette{ background:radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.7) 100%); }
  .card{
    border-radius:4px; border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 60px 120px -50px rgba(0,0,0,0.95), 0 0 80px -50px rgba(120,170,255,0.35);
    background:
      linear-gradient(#fff,#fff) top left/14px 1px no-repeat, linear-gradient(#fff,#fff) top left/1px 14px no-repeat,
      linear-gradient(#fff,#fff) top right/14px 1px no-repeat, linear-gradient(#fff,#fff) top right/1px 14px no-repeat,
      linear-gradient(#fff,#fff) bottom left/14px 1px no-repeat, linear-gradient(#fff,#fff) bottom left/1px 14px no-repeat,
      linear-gradient(#fff,#fff) bottom right/14px 1px no-repeat, linear-gradient(#fff,#fff) bottom right/1px 14px no-repeat,
      var(--card);
  }
  .avatar::after{ background:radial-gradient(closest-side, rgba(140,180,255,0.20), transparent 72%); }
  h1{ font-stretch:125%; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; font-size:28px; line-height:1.1; }
  .role{ font-stretch:100%; }
  .status{ color:var(--dim); letter-spacing:0.2em; }
  .status .dot{ background:#4BE38A; }
  .save{
    background:#fff; color:#000; box-shadow:none; border-radius:2px;
    font-stretch:125%; text-transform:uppercase; letter-spacing:0.2em; font-size:12.5px; font-weight:600;
  }
  .save:hover{ box-shadow:0 0 0 1px #fff, 0 0 40px -8px rgba(160,200,255,0.6); }
  .actions button,.quick a,.social,.book,.book .bk-ic{ border-radius:2px; }
  .actions button{ text-transform:uppercase; letter-spacing:0.16em; font-size:11.5px; font-stretch:125%; }
  .quick a{ text-transform:uppercase; letter-spacing:0.14em; font-size:10.5px; }
  .book{ border-color:rgba(255,255,255,0.22); background:rgba(255,255,255,0.04); }
  .book .bk-ic{ background:rgba(255,255,255,0.08); }
  .sep{ color:var(--dim); letter-spacing:0.3em; opacity:1; }
  #qrModal .sheet{ border-radius:4px; }

<style>

  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="card" id="card">

      <span class="halo"></span>
      <span class="orbit"></span>

    </div>

    <h1 class="reveal" id="name">Hanees Hazli</h1>
    <p class="role reveal" id="role"></p>
    <p class="status reveal"><span class="dot"></span><span id="statusText">Malaysia</span><span class="caret"></span></p>
    <div class="cred reveal" id="cred" hidden></div>

    <button class="save reveal" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span id="saveLabel">Save my contact</span>
    </button>

    <a class="book reveal" id="bookBtn" href="#" target="_blank" rel="noopener" hidden>
      <span class="bk-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/><path d="M12 13v3l2 1"/></svg></span>
      <span class="bk-tx"><b id="bookLabel">Book a strategy session</b><small id="bookSub">15 min · pick a time that suits you</small></span>
      <span class="bk-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <div class="actions reveal" id="actions">
      <button id="shareBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>Share</span>
      </button>
      <button id="qrBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>
        <span>QR</span>
      </button>
    </div>

    <div class="quick reveal" id="quick"></div>

    <div class="sep reveal">Follow along</div>
    <nav class="socials reveal" id="socials" aria-label="Social profiles"></nav>

    <footer class="reveal" id="footer"></footer>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

      <p id="qrUrl"></p>
      <div class="qrbox" id="qrbox"></div>
      <button class="close" id="qrClose" type="button">Done</button>
    </div>
  </div>

<script>

var qrcode = function() {

  // qrcode

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;

      var maxDcCount = 0;
      var maxEcCount = 0;

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {

            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            index += 1;
          }
        }

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {

      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';

      qrSvg += '<path d="';

    };

      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {

        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {

/* ---- Render ---- */
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

document.getElementById('monogram').textContent = CONFIG.initials || (CONFIG.firstName[0]+CONFIG.lastName[0]);

// Status line under the name: location + live local time
(function(){
  const el = document.getElementById('statusText');
  const loc = [CONFIG.location.city, CONFIG.location.country].filter(Boolean).join(', ');
  const tz = CONFIG.timeZone || '';
  function tick(){
    let t = '';
    if (tz){ try{ t = new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', timeZone: tz }).format(new Date()); }catch(e){} }
    el.textContent = [loc, t ? t + ' local' : ''].filter(Boolean).join(' · ');
  }
  tick(); setInterval(tick, 15000);
})();
// Staggered entrance

// Quick row — resolves each key from a core field or the socials list
function resolveAction(key){
  if (key==='call'     && CONFIG.phone)    return {ic:'phone',    label:'Call',     href:'tel:'+CONFIG.phone.replace(/[^\d+]/g,'')};
  if (key==='whatsapp' && CONFIG.whatsapp) return {ic:'whatsapp', label:'WhatsApp', href:'https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(CONFIG.whatsappMessage||'')};
  if (key==='email'    && CONFIG.email)    return {ic:'mail',     label:'Email',    href:'mailto:'+CONFIG.email};
  if (key==='website'  && CONFIG.website)  return {ic:'website',  label:'Website',  href:CONFIG.website};
  const s = CONFIG.socials.find(x => x.key===key && x.url && x.url.trim());
  return s ? {ic:s.key, label:s.name, href:s.url} : null;
}
const quick = (CONFIG.quickActions || []).map(resolveAction).filter(Boolean);
document.getElementById('quick').innerHTML = quick.map(q =>
  `<a href="${esc(q.href)}">${ICONS[q.ic] || ICONS.globe}<span>${esc(q.label)}</span></a>`

      <span class="ic">${ICONS[s.key] || ICONS.globe}</span>

/* ---- vCard: the "save my number" magic ---- */
function buildVCard(){
  const L = CONFIG.location;
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${CONFIG.lastName};${CONFIG.firstName};;;`,
    `FN:${CONFIG.fullName}`,
    CONFIG.org   ? `ORG:${CONFIG.org}` : '',
    CONFIG.title ? `TITLE:${CONFIG.title}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET:${CONFIG.email}` : '',
    CONFIG.website ? `URL:${CONFIG.website}` : '',
    `ADR;TYPE=WORK:;;;${L.city||''};${L.region||''};;${L.country||''}`,
    ...(() => {
      const seen = new Set(CONFIG.website ? [CONFIG.website.trim().replace(/\/$/,'')] : []);
      return CONFIG.socials.filter(s => s.url && s.url.trim()).map(s => {
        const u = s.url.trim().replace(/\/$/,'');
        if (seen.has(u)) return '';
        seen.add(u); return `URL:${s.url}`;
      }).filter(Boolean);
    })(),
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 3200);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  try{
    const blob = new Blob([buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Contact card downloaded — open it to add me.');
  }catch(e){
    toast('Could not download. Try the WhatsApp or email button instead.');
  }
});

/* ---- Cal.com booking popup ---- */
(function(){
  const b = CONFIG.booking || {};
  const link = (b.calLink || '').trim().replace(/^https?:\/\/(app\.)?cal\.com\//, '');
  if (!link) return;
  const btn = document.getElementById('bookBtn');
  btn.href = 'https://cal.com/' + link;
  btn.setAttribute('data-cal-link', link);
  btn.setAttribute('data-cal-config', '{"layout":"month_view","theme":"dark"}');
  if (b.label) document.getElementById('bookLabel').textContent = b.label;
  if (b.sub) document.getElementById('bookSub').textContent = b.sub;
  btn.hidden = false;

  // Cal's embed is a chunk of third-party JS we don't need to open the page.
  // Fetch it on the first sign the visitor is heading for the button, and
  // otherwise once the page has gone quiet — so it's ready by the time anyone
  // taps, without ever sitting in front of the first paint. If a tap somehow
  // beats it, the button is a plain link to cal.com and still works.
  let calBooted = false;
  function bootCal(){
    if (calBooted) return; calBooted = true;
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
    Cal("init", { origin: "https://cal.com" });
    Cal("ui", { theme: "dark", cssVarsPerTheme: { dark: { "cal-brand": "#78E3C8" } }, hideEventTypeDetails: false, layout: "month_view" });
  }
  ['pointerenter','touchstart','focus'].forEach(ev =>
    btn.addEventListener(ev, bootCal, { once:true, passive:true }));
  if ('requestIdleCallback' in window) requestIdleCallback(bootCal, { timeout:3000 });
  else addEventListener('load', () => setTimeout(bootCal, 1200));
})();

/* ---- Avatar (circle) — falls back to the monogram if no photo/video ---- */
(function(){
  const p = CONFIG.portrait || {};
  const src = p.video || p.image;
  const av = document.getElementById('avatar');
  if (!src){ av.hidden = true; document.getElementById('monogram').hidden = false; return; }
  document.getElementById('avatarPh').innerHTML = p.video
    ? `<video src="${esc(p.video)}"${p.poster ? ` poster="${esc(p.poster)}"` : ''} autoplay muted loop playsinline></video>`
    : `<img src="${esc(p.image)}" alt="${esc(CONFIG.fullName)}" width="512" height="512" decoding="async" fetchpriority="high">`;
})();

/* ---- Share + QR ---- */
(function(){
  const wrap = document.getElementById('actions');
  const shareBtn = document.getElementById('shareBtn');
  const qrBtn = document.getElementById('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!CONFIG.showShare && !CONFIG.showQR){ wrap.hidden = true; return; }
  if (!!CONFIG.showShare !== !!CONFIG.showQR) wrap.style.gridTemplateColumns = '1fr';

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share){
          await navigator.share({ title: CONFIG.fullName, text: CONFIG.fullName, url: location.href });
        } else {
          await navigator.clipboard.writeText(location.href);
          toast('Link copied to clipboard.');
        }
      }catch(e){ /* user dismissed the share sheet */ }
    });
  }

  if (CONFIG.showQR){
    const modal = document.getElementById('qrModal');
    const box = document.getElementById('qrbox');
    const openQR = () => {
      document.getElementById('qrUrl').textContent = location.href;
      if (!box.dataset.rendered && typeof qrcode === 'function'){
        try{
          const qr = qrcode(0, 'M'); qr.addData(location.href); qr.make();
          let svg = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
          const cs = getComputedStyle(document.documentElement);
          const qrBg = (cs.getPropertyValue('--qr-bg') || '#FFFFFF').trim();
          const qrFg = (cs.getPropertyValue('--qr-fg') || '#0C2A20').trim();
          svg = svg.replace(/fill="white"/g, 'fill="'+qrBg+'"')
                   .replace(/fill="black"/g, 'fill="'+qrFg+'"');
          box.innerHTML = svg; box.dataset.rendered = '1';
        }catch(e){ box.innerHTML = '<p>Could not render code.</p>'; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
    qrBtn.addEventListener('click', openQR);
    document.getElementById('qrClose').addEventListener('click', closeQR);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeQR(); });
  }
})();
</script>
<script>
/* ---- Orbit background: starfield · Earth limb · launches · satellites ---- */
(function(){
  const cv = document.getElementById('sky');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d', { alpha:false });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = matchMedia('(max-width: 480px)').matches;
  let W=0,H=0,stars=[],sats=[],launches=[],lights=[],t0=performance.now(),nextLaunch=1800,lastT=0,running=false;
  // Built once per resize instead of three times per frame.
  let gHaze=null,gAtmo=null,gBody=null;

  let R,ECX,ECY;
  function resize(){
    const dpr=Math.min(devicePixelRatio||1, small?1.5:2);
    W=innerWidth;H=innerHeight;rw=W;rh=H;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    R=Math.max(W,H)*1.35; ECX=W*0.5; ECY=H*(small?0.9:0.86)+R;
    const n=Math.round(W*H/(small?2600:1900));
    stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),tw:rnd(0,6.28)}));
    sats=Array.from({length:small?3:5},()=>({a:rnd(-1,1),r:rnd(1.06,1.3),sp:rnd(0.004,0.009)*(Math.random()<.5?-1:1),blink:rnd(0,6)}));
    lights=Array.from({length:small?90:180},()=>{const ang=-Math.PI/2+rnd(-0.55,0.55),d=rnd(0.0,0.06);return{ang,d,b:rnd(.2,1)}});

    gHaze=ctx.createRadialGradient(W*.75,H*.15,0,W*.75,H*.15,W*.8);
    gHaze.addColorStop(0,'rgba(40,60,110,0.16)');gHaze.addColorStop(1,'rgba(0,0,0,0)');
    gAtmo=ctx.createRadialGradient(ECX,ECY,R*0.985,ECX,ECY,R*1.07);
    gAtmo.addColorStop(0,'rgba(90,160,255,0.55)');gAtmo.addColorStop(0.18,'rgba(60,120,255,0.25)');
    gAtmo.addColorStop(0.5,'rgba(30,60,160,0.08)');gAtmo.addColorStop(1,'rgba(0,0,0,0)');
    gBody=ctx.createLinearGradient(0,ECY-R,0,ECY-R+H*0.25);
    gBody.addColorStop(0,'#0b1a33');gBody.addColorStop(0.08,'#050b17');gBody.addColorStop(1,'#010204');
  }
  function launch(){
    const x0=ECX+rnd(-0.25,0.25)*W;
    launches.push({x0,born:performance.now(),dur:rnd(6500,9000),dir:Math.random()<.5?-1:1,trail:[]});
  }
  function draw(now){
    const t=(now-t0)/1000;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    // faint deep-space haze
    let g;
    ctx.fillStyle=gHaze;ctx.fillRect(0,0,W,H);
    // stars, slow drift
    for(const s of stars){
      const x=(s.x - t*(2+s.z*6))%W, xx=x<0?x+W:x;
      const a=(0.25+s.z*0.75)*(0.65+0.35*Math.sin(t*1.6+s.tw));
      ctx.fillStyle='rgba(235,242,255,'+a.toFixed(3)+')';
      const sz=s.z>.93?1.6:s.z>.6?1.1:.7;ctx.fillRect(xx,s.y,sz,sz);
    }
    // orbital rings
    ctx.save();ctx.translate(ECX,ECY);
    ctx.strokeStyle='rgba(180,205,255,0.07)';ctx.lineWidth=1;
    for(const k of [1.08,1.17,1.28]){ctx.beginPath();ctx.arc(0,0,R*k,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
    ctx.setLineDash([2,7]);ctx.strokeStyle='rgba(180,205,255,0.10)';ctx.beginPath();ctx.arc(0,0,R*1.12,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
    // atmosphere glow
    ctx.fillStyle=gAtmo;ctx.beginPath();ctx.arc(ECX,ECY,R*1.07,0,Math.PI*2);ctx.fill();
    // planet body
    ctx.fillStyle=gBody;ctx.beginPath();ctx.arc(ECX,ECY,R,0,Math.PI*2);ctx.fill();
    // thin bright limb
    ctx.strokeStyle='rgba(170,210,255,0.85)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(ECX,ECY,R,Math.PI*1.2,Math.PI*1.8);ctx.stroke();
    // sunrise flare on limb
    const fx=ECX+W*0.32, fy=ECY-Math.sqrt(R*R-(W*0.32)**2);
    const pulse=0.85+0.15*Math.sin(t*0.5);
    g=ctx.createRadialGradient(fx,fy,0,fx,fy,W*0.35);
    g.addColorStop(0,'rgba(255,255,255,'+(0.55*pulse)+')');g.addColorStop(0.05,'rgba(200,225,255,0.25)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,'+(0.18*pulse)+')';ctx.fillRect(fx-W*0.4,fy-0.5,W*0.8,1);
    // city lights
    for(const l of lights){
      const ang=l.ang+ t*0.002, rr=R*(1-l.d-0.002);
      const x=ECX+Math.cos(ang)*rr, y=ECY+Math.sin(ang)*rr;
      if(y>H||x<0||x>W) continue;
      ctx.fillStyle='rgba(255,196,120,'+(l.b*0.5*(1-l.d*12)).toFixed(3)+')';ctx.fillRect(x,y,1,1);
    }
    // satellites
    for(const s of sats){
      s.a+=s.sp*0.016;const ang=-Math.PI/2+s.a;
      const x=ECX+Math.cos(ang)*R*s.r,y=ECY+Math.sin(ang)*R*s.r;
      if(s.a>1.2)s.a=-1.2;if(s.a<-1.2)s.a=1.2;

    }
    // launches
    if(!reduce && now-lastT>nextLaunch){lastT=now;nextLaunch=rnd(7000,12000);launch();}
    launches=launches.filter(L=>now-L.born<L.dur+2500);
    for(const L of launches){
      const p=Math.min(1,(now-L.born)/L.dur), e=p*p;
      const baseY=ECY-Math.sqrt(Math.max(0,R*R-(L.x0-ECX)**2));
      const x=L.x0+L.dir*e*W*0.35, y=baseY-(p*0.9+e*0.1)*H*0.95;

      ctx.lineCap='round';
      for(let i=1;i<L.trail.length;i++){
        const a=L.trail[i-1],b=L.trail[i],age=(now-b.b)/2600;
        if(age>1) continue;
        ctx.strokeStyle='rgba(220,235,255,'+((1-age)*0.55).toFixed(3)+')';ctx.lineWidth=(1-age)*2.2+0.3;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
      L.trail=L.trail.filter(q=>now-q.b<2600);
      if(p<1){
        g=ctx.createRadialGradient(x,y,0,x,y,16);g.addColorStop(0,'rgba(255,240,215,1)');g.addColorStop(0.25,'rgba(255,190,120,0.55)');g.addColorStop(1,'rgba(255,150,80,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
      }
    }
  }
  // 30fps on phones: the scene drifts slowly, so half the frames look the
  // same and cost half the battery.
  const minFrame = small ? 1000/30 : 0;
  let lastFrame = 0;
  function loop(now){
    if(!running) return;
    requestAnimationFrame(loop);
    if(now-lastFrame < minFrame) return;
    lastFrame = now;
    draw(now);
  }
  function start(){ if(reduce){draw(performance.now());return;} if(!running){running=true;requestAnimationFrame(loop);} }
  let rw=0, rh=0, rt=0;
  addEventListener('resize',()=>{
    // On a phone, hiding/showing the URL bar fires resize in the middle of a
    // scroll. Rebuilding every star and gradient there is what makes the
    // scroll stutter, so ignore height-only wobble and settle before redoing it.
    if(innerWidth===rw && Math.abs(innerHeight-rh)<140) return;
    clearTimeout(rt);
    rt=setTimeout(()=>{ resize(); if(reduce) draw(performance.now()); },150);
  },{passive:true});
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) running=false; else start(); });
  resize(); if(!reduce) setTimeout(launch,600); start();
})();
/* HUD telemetry */
(function(){
  const alt=document.getElementById('hudAlt'),vel=document.getElementById('hudVel');
  if(!alt) return; const s0=Date.now();
  setInterval(()=>{const s=Math.floor((Date.now()-s0)/1000);
    alt.textContent='ALT '+(408+Math.sin(s/9)*1.4).toFixed(1)+' KM';
    vel.textContent='VEL '+(7.66+Math.sin(s/5)*0.01).toFixed(2)+' KM/S';},1000);
})();
</script>
